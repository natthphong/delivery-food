Env: local
MigrateAuto: false

Server:
  Name: microservice-data-panel
  Port: "8080"

LogConfig:
  Level: debug

DBConfig:
  Host: localhost
  Port: "5432"
  Username: postgres
  Password: postgres
  Name: microservice_data_panel
  MaxOpenConn: 10
  MaxConnLifeTime: 300

RedisConfig:
  Enabled: false
  Mode: normal
  Host: localhost
  Port: "6379"
  Password: ""
  DB: 0
  PoolTimeout: 10s
  DialTimeout: 10s
  WriteTimeout: 5s
  ReadTimeout: 5s
  ConnMaxIdleTime: 30s

HTTP:
  TimeOut: 10s
  MaxIdleConn: 50
  MaxIdleConnPerHost: 10
  MaxConnPerHost: 50

CORSConfig:
  AllowOrigins: "http://localhost:3000"
  AllowMethods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
  AllowHeaders: "Origin,Content-Type,Accept,Authorization,traceId"
  AllowCredentials: true

AuthConfig:
  JWTSecret: "change-me-local-secret"
  AccessTokenMinutes: 60
  EnableMockAuth: false
  OAuthLoginURL: ""
  OAuthCallbackURL: ""
  OAuthClientID: ""
  OAuthClientSecret: ""
  OAuthProviderAudience: ""

PermissionConfig: {}
